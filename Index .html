const $=document.getElementById("app");let S={},NAME="",P={};

function welcome(){$.innerHTML=`<div class="card gold"><div class="ayah">﴿ إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا ﴾</div><h2>طلاب مستر يوسف الوكيل</h2><div class="ph">01098102012</div></div><p class="s" style="font-size:18px;color:var(--tx)">Welcome! Write your name to start:</p><input id="nm" class="nm" placeholder="Your name" autocomplete="off"><div style="text-align:center"><button style="width:auto;padding:12px 36px;margin-top:14px" onclick="go()">Start</button></div>`}

function mx(i){return M[i].r?15:14}
function start(i){let m=M[i],st=m.q.map(x=>({t:"m",x:x.split("|")}));if(m.r)m.r.forEach(x=>st.push({t:"r",x}));else st.push({t:"c",x:m.c});S={i,st,n:0,sc:0,done:false,max:mx(i)};show()}
function head(){return `<div class="top"><span>Model ${S.i+1} · ${S.n+1}/${S.st.length}</span><span>⭐ ${S.sc}</span></div><div class="bar"><i style="width:${S.n/S.st.length*100}%"></i></div>`}
function show(){let c=S.st[S.n];if(c.t=="c")return showFi();let h=head()+`<div class="card">`;
if(c.t=="m"){h+=`<div class="q">${S.n+1}. ${c.x[0].replace("___","<b>_____</b>")}</div>`+[1,2,3,4].map(j=>`<button class="o" onclick="pick(${j-1})">${"abcd"[j-1]}. ${c.x[j]}</button>`).join("")}
else h+=`<div class="q">${S.n-9}. ${c.x[0]} <b style="color:var(--gold)">(${c.x[1]})</b></div><p class="s" style="margin:0 0 8px">أعد كتابة الجملة باستخدام الكلمة اللي بين الأقواس</p><input id="in" autocomplete="off" autocapitalize="off" placeholder="Type your sentence"><button onclick="chk()">تأكيد ✔</button>`;
$.innerHTML=h+`<div id="fb" class="fb"></div></div>`;let e=document.getElementById("in");if(e)e.onkeydown=k=>{if(k.key=="Enter")chk()}}
function showFi(){let q=S.st[S.n].x;if(!S.pl){S.pl=[null,null,null,null];S.sel=null}
let tx=q.t.split(/\[(\d)\]/).map((p,i)=>{if(i%2==0)return p;let k=p-1,w=S.pl[k],c=S.done?(w==q.a[k]?"ok":"no"):"";return `<span class="bl ${c}" onclick="bl(${k})">${w||"("+p+" ......)"}</span>`}).join("");
let bank=S.done?"":q.w.filter(w=>!S.pl.includes(w)).map(w=>`<span class="tl${S.sel==w?" sel":""}" onclick="sw('${w}')">${w}</span>`).join("");
let fb=S.done?`<div class="fb">${S.pl.filter((w,k)=>w==q.a[k]).length}/4 ✅</div><div class="fb" dir="ltr">${q.a.map((w,k)=>(k+1)+"."+w).join("  ")}</div><button onclick="nxt()">التالي ➡</button>`:`<button onclick="chkFi()">تأكيد ✔</button>`;

function sw(w){S.sel=S.sel==w?null:w;showFi()}
function bl(k){if(S.done)return;if(S.sel){S.pl=S.pl.map(x=>x==S.sel?null:x);S.pl[k]=S.sel;S.sel=null}else S.pl[k]=null;showFi()}
function chkFi(){if(S.done)return;let q=S.st[S.n].x;S.sc+=S.pl.filter((w,k)=>w==q.a[k]).length;S.done=true;showFi()}
